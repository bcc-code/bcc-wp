# Release workflow for the BCC – Generate Summary with AI plugin

name: bcc-generate-summary-with-ai plugin

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
    paths:
      - plugins/bcc-generate-summary-with-ai/**
      - .github/workflows/bcc-generate-summary-with-ai-plugin-release.yml
    tags-ignore:
      - '**'
  pull_request:
    branches: [ master ]
    paths:
      - plugins/bcc-generate-summary-with-ai/**
      - .github/workflows/bcc-generate-summary-with-ai-plugin-release.yml
    tags-ignore:
      - '**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint:
    name: Lint PHP - validate code
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: ./plugins/bcc-generate-summary-with-ai

    steps:
    - uses: actions/checkout@v6

    # This config file gets auto-loaded by PHPStan
    - name: Set PHPStan config
      run: |
        cat <<'EOF' > phpstan.neon
        parameters:
          level: 1 # form 0 to 11 where 0 is the loosest and 11 the strictest
          errorFormat: github
          paths:
            - .
          excludePaths:
            - vendor
          scanFiles:
            - dependencies.stub
        includes:
          - vendor/szepeviktor/phpstan-wordpress/extension.neon
        EOF

    - name: Install PHPStan and Wordpress-stub
      run: |
        composer require --dev phpstan/phpstan
        composer require --dev szepeviktor/phpstan-wordpress

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse --no-progress

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Get Package Version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
            path: 'plugins/bcc-generate-summary-with-ai/package.json'
            prop_path: 'version'

      - name: Get Previous Updated
        id: lastupdated
        uses: notiz-dev/github-action-json-property@release
        with:
            path: 'plugins/bcc-generate-summary-with-ai/package.json'
            prop_path: 'last_updated'

      # Runs a set of commands using the runners shell
      - id: build-and-zip
        name: Build and Zip Plugin
        run: |
          cd plugins/bcc-generate-summary-with-ai

          # Get package version
          package_version=${{steps.version.outputs.prop}}
          previous_date="${{steps.lastupdated.outputs.prop}}"
          current_date=$(date -u +'%Y-%m-%d %H:%M:%S')

          # Patch version = 1 + highest existing patch for this major.minor (0 if none), so bumping
          # major.minor in package.json resets the patch instead of continuing the global run number.
          major_minor="$(echo $package_version | sed -re 's/^([0-9]+\.[0-9]+)\..*/\1/')"
          last_patch=-1
          for t in $(git tag -l "bcc-generate-summary-with-ai-v${major_minor}.*"); do
            patch="${t##*.}"
            if [ "$patch" -gt "$last_patch" ]; then
              last_patch=$patch
            fi
          done
          build_version="${major_minor}.$((last_patch + 1))"


          sed -i "s|$package_version|$build_version|g" package.json
          sed -i "s|$previous_date|$current_date|g" package.json
          sed -i "s|<VERSION>|$build_version|g" bcc-generate-summary-with-ai.php
          # Target the version header/field directly instead of matching the old package_version
          # string, so a one-off drift between package.json and the plugin file can't persist forever.
          sed -i -E "s/(\*[[:space:]]*Version:[[:space:]]*)[0-9]+\.[0-9]+\.[0-9]+/\1${build_version}/" bcc-generate-summary-with-ai.php
          sed -i -E "s/(const[[:space:]]+VERSION[[:space:]]*=[[:space:]]*')[0-9]+\.[0-9]+\.[0-9]+(')/\1${build_version}\2/" bcc-generate-summary-with-ai.php


          git config user.name "bcc-bot"
          git config user.email "<>"
          git tag "version-bump-v${build_version}"
          git commit -am "Released bcc-generate-summary-with-ai plugin v${build_version}"
          git push

          cd ..
          zip -r bcc-generate-summary-with-ai.zip bcc-generate-summary-with-ai
          cd ..

          echo "::set-output name=tag_name::bcc-generate-summary-with-ai-v${build_version}"



      - uses: ncipollo/release-action@v1
        name: Create Release
        with:
          artifacts: "plugins/bcc-generate-summary-with-ai.zip"
          tag: ${{steps.build-and-zip.outputs.tag_name}}
          token: ${{ secrets.GITHUB_TOKEN }}
