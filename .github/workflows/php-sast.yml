name: PHP Code Analysis

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "plugins/**"
      - ".github/workflows/php-sast.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "plugins/**"
      - ".github/workflows/php-sast.yml"

permissions:
  contents: read
  security-events: write # Required to upload SARIF files

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # This config file gets auto-loaded by Psalm
    # !!!! The old bcc-signon plugin and the bcc-wp-proxy plugin are excluded from analysis!
    - name: Set Psalm config
      run: |
        cat <<'EOF' > psalm.xml
        <?xml version="1.0"?>
        <!-- Psalm has levels of strictness (errorLevel) from 1 (most strict) to 8 (most lenient). -->
        <psalm
          xmlns="https://getpsalm.org/schema/config"
          errorLevel="2"
        >
          <projectFiles>
            <directory name="plugins" />
            <ignoreFiles>
              <directory name="plugins/bcc-signon" />
              <directory name="plugins/bcc-wp-proxy" />
            </ignoreFiles>
          </projectFiles>
          <stubs>
            <file name="custom-defs.stub" />
          </stubs>
          <plugins>
            <pluginClass class="PsalmWordPress\Plugin">
              <requireAllParams value="true" />
            </pluginClass>
          </plugins>
        </psalm>
        EOF

    - name: Create stubs for dependency functions (e.g. other plugin funcions). If this grows too big it can be commited as a separate file
      run: |
        cat <<'EOF' > custom-defs.stub
        <?php

        /**
        * @param mixed $post_id
        * @return mixed|null
        */
        function get_field(
            string $selector,
            $post_id = false,
            bool $format_value = true,
            bool $escape_html = false
        ) {};

        /**
        * @return string
        */
        function get_culture() {};
        EOF

    # Psalm is installed with Composer and pinned to a major version, because the psalm-github-actions image
    # always runs the latest Psalm, and 7.0.0-rc1 crashes with humanmade/psalm-plugin-wordpress.
    # PHP is pinned as well: it decides which Psalm 6.x Composer picks, and on the runner's PHP 8.3.6
    # that is 6.5.0, which refuses to run below PHP 8.3.16.
    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.4'
        coverage: none
        tools: composer

    - name: Install Psalm and Wordpress stubs
      run: |
        composer require --dev "vimeo/psalm:^6.0" "php-stubs/wordpress-stubs:~6.8.0" humanmade/psalm-plugin-wordpress

    - name: Run Psalm
      run: vendor/bin/psalm --output-format=github --taint-analysis --report=results.sarif

    # Also upload when Psalm found issues (the step above then fails), so they show up in code scanning.
    # The check on the report skips the upload when Psalm couldn't run at all.
    - name: Upload Security Analysis results to GitHub
      if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
