# Keeps the GitHub Actions in .github/workflows and the npm packages of the yarn workspace
# up to date. New versions wait 7 days first.
#
# GitHub Actions: both those used by tag (e.g. actions/checkout@v6) and those pinned to a
# commit with a version comment (e.g. ncipollo/release-action@<sha> # v1.21.0). A change to a
# plugin's release workflow releases that plugin, so all updates come in one pull request a
# month: one merge, one round of releases.
#
# npm: the root package.json, the plugins' package.json files and yarn.lock. Minor and patch
# updates come together in one pull request a month. Each major update comes in a pull request
# of its own, since it may need changes elsewhere. A change to a plugin's package.json releases
# that plugin. A change to only the root package.json and yarn.lock releases nothing, but pull
# requests that change them still build bcc-login (see bcc-login-plugin-release.yml).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Raise the version range in package.json too, so it shows what is actually installed.
    versioning-strategy: "increase"
    ignore:
      # primereact 11 needs React 19. bcc-login renders primereact inside the block editor,
      # with the React that WordPress ships, and that is still 18.3 (up to 7.0 and trunk).
      # Remove this once WordPress ships React 19. Minor and patch updates of 10.x still come.
      - dependency-name: "primereact"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
